spring.application.name=post-service
server.port=${PORT:8082}

# ---- Database ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false

# ---- Auth ----
jwt.secret=${JWT_SECRET}
internal.api-token=${INTERNAL_API_TOKEN}

# ---- Other services ----
services.user.url=${USER_SERVICE_URL:http://localhost:8081}

# ---- Optional image uploads (Cloudinary) ----
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ---- Performance ----
spring.threads.virtual.enabled=true
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.max-lifetime=1500000
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# ---- Cache (Redis). CACHE_TYPE=none disables caching (used for before/after load tests). ----
spring.cache.type=${CACHE_TYPE:redis}
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.data.redis.timeout=500ms

# ---- Operations ----
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
# readiness = can serve traffic (database reachable); liveness = process healthy
management.endpoint.health.group.readiness.include=readinessState,db
management.health.redis.enabled=false
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.error.include-stacktrace=never
server.error.include-message=never

# OpenAPI docs: /v3/api-docs and /swagger-ui.html (never routed by the gateway; disabled in prod)
springdoc.api-docs.path=/v3/api-docs

# JWT-only APIs: no default in-memory user / generated password
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
