server:
  port: ${PORT:8080}
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json,text/plain

spring:
  application:
    name: api-gateway
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      timeout: 1s
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2000
            response-timeout: 15s
          # Strict CORS: only the configured frontend origin(s).
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/api/**]':
                allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
                allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
                allowed-headers: Authorization,Content-Type,X-Requested-With
                allow-credentials: true
                max-age: 3600
          default-filters:
            # Clients may never smuggle the service-to-service secret.
            - RemoveRequestHeader=X-Internal-Token
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${RATE_LIMIT_PER_SECOND:20}
                redis-rate-limiter.burstCapacity: ${RATE_LIMIT_BURST:40}
                key-resolver: "#{@userOrIpKeyResolver}"
          # Only /api/** is routed. /internal/** is never exposed (no route -> 404).
          routes:
            - id: auth
              uri: ${USER_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/auth/**
              filters:
                # stricter bucket for login/register/refresh (brute force protection)
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: ${AUTH_RATE_LIMIT_PER_SECOND:1}
                    redis-rate-limiter.burstCapacity: ${AUTH_RATE_LIMIT_BURST:10}
                    key-resolver: "#{@clientIpKeyResolver}"
            - id: users
              uri: ${USER_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/users/**,/api/badges/**
            - id: posts
              uri: ${POST_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/posts/**,/api/tags/**,/api/uploads/**
            - id: comments
              uri: ${COMMENT_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/comments/**
            - id: search
              uri: ${SEARCH_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/search/**,/api/search
            - id: notifications
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/notifications/**,/api/notifications

jwt:
  secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      enabled: false
