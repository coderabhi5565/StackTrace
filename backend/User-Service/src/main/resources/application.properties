spring.application.name=user-service
server.port=${PORT:8081}

# ---- Database (all values from env; defaults are for local dev only) ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/userdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---- Auth ----
# Shared HS256 secret (>= 32 bytes). Required, no default.
jwt.secret=${JWT_SECRET}
# Access token lifetime (ms). Default 15 minutes.
jwt.expiration=${JWT_ACCESS_TTL_MS:900000}
# Refresh token lifetime (ms). Default 7 days.
jwt.refresh-expiration=${JWT_REFRESH_TTL_MS:604800000}
# Shared secret for /internal/** service-to-service calls. Required, no default.
internal.api-token=${INTERNAL_API_TOKEN}

# ---- Other services ----
services.notification.url=${NOTIFICATION_SERVICE_URL:http://localhost:8085}

spring.jackson.time-zone=UTC

# ---- Performance ----
spring.threads.virtual.enabled=true
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.max-lifetime=1500000

# ---- Cache (Redis). CACHE_TYPE=none disables caching. ----
spring.cache.type=${CACHE_TYPE:redis}
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.data.redis.timeout=500ms

# ---- Operations ----
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
# readiness = can serve traffic (database reachable); liveness = process healthy
management.endpoint.health.group.readiness.include=readinessState,db
management.health.redis.enabled=false
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.error.include-stacktrace=never
server.error.include-message=never

# OpenAPI docs: /v3/api-docs and /swagger-ui.html (never routed by the gateway; disabled in prod)
springdoc.api-docs.path=/v3/api-docs

# JWT-only APIs: no default in-memory user / generated password
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
