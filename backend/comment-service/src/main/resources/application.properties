spring.application.name=comment-service
server.port=${PORT:8083}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/commentdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.jackson.time-zone=UTC

jwt.secret=${JWT_SECRET}
internal.api-token=${INTERNAL_API_TOKEN}

post-service.url=${POST_SERVICE_URL:http://localhost:8082}
user-service.url=${USER_SERVICE_URL:http://localhost:8081}
notification-service.url=${NOTIFICATION_SERVICE_URL:http://localhost:8085}

# Fail fast on slow dependencies
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=3000

# ---- Performance ----
spring.threads.virtual.enabled=true
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.max-lifetime=1500000

# ---- Operations ----
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
# readiness = can serve traffic (database reachable); liveness = process healthy
management.endpoint.health.group.readiness.include=readinessState,db
management.health.redis.enabled=false
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.error.include-stacktrace=never
server.error.include-message=never

# OpenAPI docs: /v3/api-docs and /swagger-ui.html (never routed by the gateway; disabled in prod)
springdoc.api-docs.path=/v3/api-docs
