spring.application.name=notification-service
server.port=${PORT:8085}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.jackson.time-zone=UTC

jwt.secret=${JWT_SECRET}
internal.api-token=${INTERNAL_API_TOKEN}
user-service.url=${USER_SERVICE_URL}

# ---- Performance ----
spring.threads.virtual.enabled=true
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.max-lifetime=1500000

# ---- Operations ----
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
# readiness = can serve traffic (database reachable); liveness = process healthy
management.endpoint.health.group.readiness.include=readinessState,db
management.health.redis.enabled=false
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.error.include-stacktrace=never
server.error.include-message=never

# OpenAPI docs: /v3/api-docs and /swagger-ui.html (never routed by the gateway; disabled in prod)
springdoc.api-docs.path=/v3/api-docs

# JWT-only APIs: no default in-memory user / generated password
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
