# Budget option: all backend services in ONE Fly machine (deploy/bundle/Dockerfile). Public = gateway.
app = "__PREFIX__-backend"
primary_region = "__REGION__"

[build]
  dockerfile = "deploy/bundle/Dockerfile"

[env]
  SPRING_PROFILES_ACTIVE = "prod"
  SERVICES = "user post comment search notification gateway"
  GATEWAY_PORT = "8080"
  DB_POOL_SIZE = "4"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "180s"
  interval = "20s"
  timeout = "5s"
  method = "GET"
  path = "/actuator/health/readiness"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
