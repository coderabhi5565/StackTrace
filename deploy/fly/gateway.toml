# Fly.io app for gateway. Rendered by deploy/fly/deploy.sh (__PREFIX__ / __REGION__ placeholders).
app = "__PREFIX__-gateway"
primary_region = "__REGION__"

[env]
  PORT = "8080"
  SPRING_PROFILES_ACTIVE = "prod"
  JAVA_OPTS = "-XX:MaxRAMPercentage=70 -XX:+UseSerialGC -Xss512k -XX:+ExitOnOutOfMemoryError -XX:TieredStopAtLevel=1"
  USER_SERVICE_URL = "http://__PREFIX__-user-service.flycast"
  POST_SERVICE_URL = "http://__PREFIX__-post-service.flycast"
  COMMENT_SERVICE_URL = "http://__PREFIX__-comment-service.flycast"
  SEARCH_SERVICE_URL = "http://__PREFIX__-search-service.flycast"
  NOTIFICATION_SERVICE_URL = "http://__PREFIX__-notification-service.flycast"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 300

[[http_service.checks]]
  grace_period = "90s"
  interval = "15s"
  timeout = "5s"
  method = "GET"
  path = "/actuator/health/readiness"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
